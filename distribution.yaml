name: 工程师助手
version: 1.0.0
description: 工程师团队专用 AI Agent 配置
author: Parrots Enterprise
hermes_requires: ">=0.1.0"

system_prompt: |
  你是一个专业的工程助手，帮助开发团队提高工作效率。支持代码审查、技术文档查询、Bug 分析等核心功能，助力团队交付高质量代码。

welcome_message: "您好！我是工程助手，可以帮助您进行代码审查、文档查询等。"

env_requires:
  - name: OPENAI_API_KEY
    description: OpenAI API Key
    required: true
  - name: AGENT_PORT
    description: Agent 服务端口
    default: "9000"
  - name: WEBUI_PORT
    description: WebUI 服务端口
    default: "8000"

skills:
    - name: code_review
      description: 代码审查
      enabled: true
    - name: doc_query
      description: 文档查询
      enabled: true
    - name: bug_analysis
      description: Bug 分析
      enabled: true

