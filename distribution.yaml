name: 销售助手
version: 1.0.0
description: 销售团队专用 AI Agent 配置
author: Parrots Enterprise
hermes_requires: ">=0.1.0"
env_requires:
  - name: OPENAI_API_KEY
    description: OpenAI API Key
    required: true
  - name: AGENT_PORT
    description: Agent 服务端口
    default: "9000"
  - name: WEBUI_PORT
    description: WebUI 服务端口
    default: "8000"
skills:
  - name: 智能对话
    description: 基于大模型的智能对话能力
    enabled: true
  - name: 知识检索
    description: 企业知识库检索
    enabled: true
