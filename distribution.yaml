name: 人力资源助手
version: 1.0.0
description: 人力资源团队专用 AI Agent 配置
hermes_requires: ">=0.1.0"
author: Parrots Enterprise
license: MIT

# 兼容字段：WebUI 欢迎消息（非 Hermes 标准字段，被安全忽略）
welcome_message: "您好！我是人力资源助手，有什么可以帮助您的吗？"

# 安装者需要配置的环境变量
env_requires:
  - name: OPENAI_API_KEY
    description: OpenAI API Key
    required: true
  - name: AGENT_PORT
    description: Agent 服务端口
    default: "9000"
  - name: WEBUI_PORT
    description: WebUI 服务端口
    default: "8000"
